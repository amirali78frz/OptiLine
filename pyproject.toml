[project]
name = "OptiLine-R"
version = "0.1.7"
description = "Raceline optimisation tools"
authors = [
    {name = "Amir Ali Farzin", email = "amirali77farzin@gmail.com"}
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/amirali78frz/OptiLine.git"
repository = "https://github.com/amirali78frz/OptiLine.git"
keywords = ["raceline", "optimization", "autonomous racing, zeroth-order"]
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "pillow>=10.0,<12",
    "quadprog>=0.1.13,<0.2",
    "casadi>=3.7,<4",
]

[tool.poetry]
packages = [{ include = "OptiLine", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
black = "^25.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
